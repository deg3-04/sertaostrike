<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sertão Strike — FPS na rede local</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23ffb627' stroke-width='6'/%3E%3Cpath d='M32 2v20M32 42v20M2 32h20M42 32h20' stroke='%23ffb627' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "/lib/three.js" } }</script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="killfeed"></div>
    <div id="topbar">
      <div id="timer">--:--</div>
      <div id="matchinfo"></div>
      <div id="banner"></div>
    </div>
    <div id="radarwrap"><canvas id="radar" width="200" height="200"></canvas></div>
    <div id="perf"></div>
    <canvas id="crosshair" width="200" height="200"></canvas>
    <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
    <div id="dmgind"></div>
    <div id="nametag"></div>
    <div id="centermsg"></div>
    <div id="announce"></div>
    <div id="protect"></div>
    <div id="vitals">
      <div class="vital"><span class="ico">✚</span><span id="hp">100</span><div class="bar"><div id="hpbar"></div></div></div>
      <div class="vital"><span class="ico" id="armorico">⛨</span><span id="ar">100</span><div class="bar"><div id="arbar"></div></div></div>
    </div>
    <div id="ammo">
      <div id="nades"></div>
      <div id="weapname"></div>
      <div id="ammonum"><span id="mag">30</span><span id="res">/ 90</span></div>
    </div>
    <div id="slots"></div>
    <div id="chat"><div id="chatlog"></div><input id="chatinput" maxlength="120" autocomplete="off" placeholder="Mensagem (Enter envia, Esc cancela)"></div>
    <div id="scope" class="hidden"><div class="ring"></div><div class="lineh"></div><div class="linev"></div><div class="dot"></div></div>
    <div id="smokeov"></div>
    <div id="vignette"></div>
    <div id="flash"></div>
    <div id="death" class="hidden"></div>
    <div id="toast"></div>
  </div>

  <div id="scoreboard" class="hidden"></div>
  <div id="endscreen" class="hidden"></div>
  <div id="start"></div>
  <div id="room" class="hidden"></div>
  <div id="loadout" class="overlay hidden"></div>
  <div id="equipguide" class="overlay hidden"></div>
  <div id="pause" class="overlay hidden"></div>
  <div id="settings" class="overlay hidden"></div>
  <div id="clicktoplay" class="hidden"><div>Clique para continuar</div><small>Esc abre o menu</small></div>
  <div id="loading"><div class="spinner"></div><div id="loadingtext">Carregando Sertão Strike...</div></div>
  <div id="fatal" class="hidden"></div>

  <script>
    if (location.protocol === 'file:') {
      document.getElementById('loadingtext').innerHTML = 'Este arquivo não pode ser aberto direto.<br>Inicie o servidor (iniciar-servidor.bat) e abra <b>http://localhost:3000</b> no Chrome ou Edge.';
      document.querySelector('.spinner').style.display = 'none';
    }
    setTimeout(function () {
      var l = document.getElementById('loading');
      if (l && !l.classList.contains('hidden') && location.protocol !== 'file:') document.getElementById('loadingtext').innerHTML += '<br><small>Demorando? Use Chrome ou Edge atualizados e verifique se a aceleração de hardware está ativa.</small>';
    }, 15000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
